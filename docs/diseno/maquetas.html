<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DonaVida – Maquetas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--rojo:#B3122E;--rojo2:#E11D48;--rojoT:#FDEEF1;--rojoB:#F9D3DA;--verde:#16A34A;--verdeT:#EEFBF3;--verdeB:#C9F0D8;--amb:#B45309;--ambT:#FEF6E7;--azul:#2563EB;--azulT:#EEF4FF;--tx:#1E2230;--tx2:#6B7280;--tx3:#9CA3AF;--bd:#EDEEF1;--bg:#F6F7F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:14px}
button{font-family:inherit;cursor:pointer}
.demo{background:#1E2230;color:#fff;display:flex;gap:6px;align-items:center;padding:8px 16px;font-size:12px}
.demo b{margin-right:8px;font-weight:500;opacity:.7}
.demo button{background:transparent;border:1px solid #3B4152;color:#fff;border-radius:99px;padding:5px 14px;font-size:12px}
.demo button.on{background:var(--rojo2);border-color:var(--rojo2)}
.app{display:flex;min-height:calc(100vh - 38px)}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.logo .ic{width:40px;height:40px;border-radius:12px;background:var(--rojo2);color:#fff;display:grid;place-items:center;font-size:22px}
.logo b{font-size:17px;display:block}.logo small{color:var(--tx2);font-size:12px}
.rolbox{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.rolbox .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.rolbox b{font-size:13px;display:block}.rolbox small{font-size:11px;color:var(--tx2)}
.lbl{font-size:11px;color:var(--tx3);letter-spacing:.06em;padding:0 10px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#3B4152;text-decoration:none;font-weight:500;margin-bottom:4px;cursor:pointer}
.nav a i{font-size:20px}
.nav a.on{background:var(--rojo2);color:#fff}
.nav a .n{margin-left:auto;background:var(--rojo);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.nav a.on .n{background:#fff;color:var(--rojo)}
.sidefoot{margin-top:auto;background:var(--rojoT);border-radius:14px;padding:14px}
.sidefoot b{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--rojo)}
.sidefoot p{font-size:12px;color:var(--tx2);margin:6px 0 10px;line-height:1.5}
.salir{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:13px;padding:12px 8px 0;cursor:pointer}
.main{flex:1;min-width:0}
.top{height:72px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:16px}
.top h1{font-size:19px;font-weight:700}.top .sub{font-size:12px;color:var(--tx2)}
.top .sp{flex:1}
.bell{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:19px;position:relative;color:#3B4152}
.bell:after{content:'';position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--rojo2);border:2px solid #fff}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:38px;height:38px;border-radius:50%;background:var(--rojo2);color:#fff;display:grid;place-items:center;font-weight:600}
.user b{font-size:13px;display:block}.user small{font-size:11px;color:var(--tx2)}
.cont{padding:24px 28px 40px}
.grid{display:grid;gap:18px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:22px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.ch h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ch h3 i{color:var(--rojo2);font-size:20px}
.ch small{color:var(--tx2);font-size:12px;display:block;font-weight:400;margin-top:2px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bp{background:var(--rojo2);color:#fff}.bs{background:var(--bg);color:var(--tx)}.bv{background:var(--verdeT);color:var(--verde)}.bo{background:#fff;border:1px solid var(--bd);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--verdeT);color:var(--verde)}.chip.ur{background:var(--rojoT);color:var(--rojo2)}.chip.ne{background:var(--bg);color:var(--tx2)}.chip.am{background:var(--ambT);color:var(--amb)}.chip.az{background:var(--azulT);color:var(--azul)}
.dot:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.g{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--rojoT);color:var(--rojo2)}
.g.s{background:var(--rojo2);color:#fff}.g.n{background:var(--bg);color:var(--tx)}
.g.r{border-radius:50%}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px}
.kpi .t{display:flex;justify-content:space-between;color:var(--tx2);font-size:13px}
.kpi .t i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px}
.kpi .v{font-size:34px;font-weight:700;margin:6px 0 4px;display:flex;align-items:baseline;gap:10px}
.kpi .d{font-size:12px;color:var(--tx2)}
.lista>div{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--bd)}
.lista>div:first-child{border-top:none;padding-top:0}
.lista .m{flex:1;min-width:0}.lista .m b{display:block;font-size:14px}.lista .m small{color:var(--tx2);font-size:12px;display:flex;align-items:center;gap:5px;margin-top:3px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 14px;background:var(--bg);font-weight:600}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0;text-align:right}
td{padding:14px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
td:last-child{text-align:right}tr:last-child td{border-bottom:none}
td small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}
.sel{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sel div{border-radius:12px;background:var(--bg);text-align:center;padding:10px 4px}
.sel b{display:block;font-size:16px}.sel span{font-size:11px;color:var(--tx2)}
.sel .c{background:var(--rojoT);color:var(--rojo2)}.sel .c span{color:var(--rojo2)}
.sel .on{background:var(--rojo2);color:#fff}.sel .on span{color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{padding:6px 12px;border-radius:99px;font-size:12px;background:var(--bg);color:var(--tx2);font-weight:500}
.pills span.on{background:var(--rojo2);color:#fff}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:0 6px;border-bottom:1px solid var(--bd)}
.bars div{flex:1;border-radius:8px 8px 0 0;position:relative}
.bars div span{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:var(--tx2)}
.bars div em{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;font-weight:600}
.aviso{display:flex;gap:10px;align-items:center;background:var(--rojoT);color:var(--rojo);border-radius:12px;padding:12px 14px;font-size:13px}
.prog{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--verde);border-radius:99px}
.ini{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.carnet{background:linear-gradient(135deg,#B3122E,#E11D48);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}
.carnet:after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);right:-80px;bottom:-110px}
.campo label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.campo input,.campo select{width:100%;height:44px;border:1px solid var(--bd);border-radius:12px;padding:0 14px;font-family:inherit;font-size:14px;background:#fff}
.switch{width:42px;height:24px;border-radius:99px;background:var(--verde);position:relative}
.switch:after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
/* login */
.login{display:flex;min-height:calc(100vh - 38px)}
.lizq{flex:1.1;background:linear-gradient(150deg,#9F0F28,#E11D48);color:#fff;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lizq:before{content:'';position:absolute;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.06);right:-140px;top:-120px}
.lizq:after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.05);left:-100px;bottom:-120px}
.lder{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px}
.lform{width:400px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.roles div{border:1.5px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer}
.roles div i{font-size:24px;color:var(--tx2)}
.roles div b{display:block;font-size:13px;margin-top:4px}
.roles div small{font-size:11px;color:var(--tx2)}
.roles div.on{border-color:var(--rojo2);background:var(--rojoT)}
.roles div.on i,.roles div.on b{color:var(--rojo2)}
</style>
</head>
<body>
<div class="demo"><b>Vista previa:</b><span id="demo"></span></div>
<div id="root"></div>
<script>
const ic=n=>`<i class="ti ti-${n}"></i>`;
const chip=(t,k)=>`<span class="chip ${k} dot">${t}</span>`;
const card=(t,sub,body,extra='',ico='')=>`<div class="card"><div class="ch"><h3>${ico?ic(ico):''}<span>${t}${sub?`<small>${sub}</small>`:''}</span></h3><div style="display:flex;gap:8px;align-items:center">${extra}</div></div>${body}</div>`;
const kpi=(t,v,extra,d,i,col)=>`<div class="kpi"><div class="t"><span>${t}</span><i class="ti ti-${i}" style="background:${col}1A;color:${col}"></i></div><div class="v">${v}${extra}</div><div class="d">${d}</div></div>`;
const tabla=(cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const gs=[['O+',16,'Estable'],['O−',4,'Crítico'],['A+',11,'Estable'],['A−',3,'Bajo'],['B+',7,'Normal'],['B−',2,'Crítico'],['AB+',5,'Normal'],['AB−',1,'Escaso']];
const selector=()=>`<div class="sel">${gs.map((x,i)=>`<div class="${i==1?'on':x[2]=='Crítico'?'c':''}"><b>${x[0]}</b><span>${x[1]} disp.</span></div>`).join('')}</div>`;
const barras=(d)=>`<div class="bars" style="margin-bottom:30px">${d.map(x=>`<div style="height:${x[1]*14}px;background:${x[0].includes('−')?'#E11D48':'#FBC6D0'}"><em>${x[1]}</em><span>${x[0]}</span></div>`).join('')}</div><div style="display:flex;gap:18px;font-size:12px;color:var(--tx2)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#E11D48"></i> Rh negativo</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#FBC6D0"></i> Rh positivo</span></div>`;
const radar=()=>`<svg viewBox="0 0 400 260" style="width:100%;background:var(--bg);border-radius:14px">
<circle cx="200" cy="130" r="110" fill="none" stroke="#E5E7EB"/><circle cx="200" cy="130" r="72" fill="none" stroke="#E5E7EB"/><circle cx="200" cy="130" r="36" fill="#FDEEF1" stroke="#F9D3DA"/>
<line x1="200" y1="10" x2="200" y2="250" stroke="#E5E7EB"/><line x1="60" y1="130" x2="340" y2="130" stroke="#E5E7EB"/>
<text x="232" y="98" font-size="10" fill="#9CA3AF">2 km</text><text x="262" y="66" font-size="10" fill="#9CA3AF">5 km</text><text x="296" y="34" font-size="10" fill="#9CA3AF">10 km</text>
<circle cx="200" cy="130" r="16" fill="#E11D48"/><text x="200" y="135" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">+</text>
${[[150,96,'O−','#E11D48'],[140,150,'O−','#E11D48'],[262,92,'O+','#16A34A'],[290,140,'AB+','#16A34A'],[250,190,'B−','#E11D48'],[170,200,'A−','#64748B']].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="13" fill="#fff" stroke="${p[3]}" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" font-size="9" fill="${p[3]}" text-anchor="middle" font-weight="700">${p[2]}</text>`).join('')}
<text x="16" y="24" font-size="11" fill="#6B7280">Tiquipaya</text><text x="384" y="24" font-size="11" fill="#6B7280" text-anchor="end">Sacaba</text><text x="16" y="248" font-size="11" fill="#6B7280">Quillacollo</text><text x="384" y="248" font-size="11" fill="#6B7280" text-anchor="end">Cercado Sur</text></svg>`;

const ROLES={
admin:{nombre:'Admin SEDES',cargo:'Administrador',ini:'AS',rolIco:'shield-check',rolCol:'#2563EB',accion:'+ Nuevo hospital',
 nav:[['res','Resumen','layout-grid'],['hos','Hospitales','building-hospital',1],['usu','Usuarios','users'],['cam','Campañas','speakerphone'],['rep','Reportes','chart-bar']],
 foot:['shield-check','Control de la red','Valida hospitales y revisa que la red funcione bien.'],
 p:{
 res:['Resumen general','Toda la red de Cochabamba',()=>`
 <div class="grid" style="grid-template-columns:repeat(4,1fr)">
 ${kpi('Donantes registrados','248',chip('+12 este mes','ok'),'Activos en la plataforma','users','#E11D48')}
 ${kpi('Hospitales en la red','3',chip('1 por validar','am'),'Conectados a DonaVida','building-hospital','#2563EB')}
 ${kpi('Solicitudes activas','4',chip('2 urgentes','ur'),'En todos los hospitales','droplet','#E11D48')}
 ${kpi('Donaciones del mes','31',chip('98% asistencia','ok'),'Registradas por hospitales','heart-handshake','#16A34A')}
 </div>
 <div class="grid" style="grid-template-columns:1.4fr 1fr;margin-top:18px">
 ${card('Hospitales por validar','Revisa sus datos antes de activarlos',`<div class="lista">
  ${[['Hospital del Norte','Quillacollo · registrado hace 2 días'],['Clínica Los Olivos','Cercado · registrado hoy']].map(h=>`<div><div class="g n">${ic('building-hospital')}</div><div class="m"><b>${h[0]}</b><small>${ic('map-pin')}${h[1]}</small></div>${chip('Pendiente','am')}<button class="btn bv sm">${ic('check')}Validar</button><button class="btn bs sm">Ver datos</button></div>`).join('')}
 </div>`,'','building-hospital')}
 ${card('Actividad reciente','',`<div class="lista">
  ${[['droplet','Hosp. Viedma publicó una solicitud O−','Hace 14 min','#E11D48'],['user-plus','Nuevo donante: Mariana Soliz (B−)','Hace 1 h','#16A34A'],['speakerphone','Campaña "Una gota de ti" creada','Hace 3 h','#2563EB']].map(a=>`<div><div class="g r" style="background:${a[3]}14;color:${a[3]};width:38px;height:38px">${ic(a[0])}</div><div class="m"><b style="font-size:13px">${a[1]}</b><small>${a[2]}</small></div></div>`).join('')}
 </div>`,'','activity')}
 </div>
 <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
 ${card('Donantes por grupo sanguíneo','Total registrados en la red',barras([['O+',9],['O−',4],['A+',7],['A−',2],['B+',5],['B−',3],['AB+',3],['AB−',1]]),'','chart-bar')}
 ${card('Campañas próximas','',`<div class="lista">${[['DIC','05','Dona sangre, comparte vida','Plaza de las Banderas · Hosp. Viedma'],['DIC','12','Una gota de ti','Campus UMSS · Hosp. del Norte']].map(c=>`<div><div class="g" style="flex-direction:column;line-height:1.1;width:50px;height:50px"><small style="font-size:10px">${c[0]}</small>${c[1]}</div><div class="m"><b>${c[2]}</b><small>${ic('map-pin')}${c[3]}</small></div>${chip('Aprobada','ok')}</div>`).join('')}</div>`,'<button class="btn bo sm">Ver todas</button>','speakerphone')}
 </div>`],
 hos:['Hospitales','Registro y validación',()=>card('Hospitales de la red','3 activos · 1 pendiente',tabla(['Hospital','Zona','Contacto','Solicitudes','Estado','Acciones'],[
  ['<b>Hospital Clínico Viedma</b><small>Hospital público · 3er nivel</small>','Cercado','4-4533240',chip('2 activas','ur'),chip('Validado','ok'),'<button class="btn bs sm">Ver</button>'],
  ['<b>Hospital Materno Germán Urquidi</b><small>Hospital público</small>','Cercado','4-4222355',chip('1 activa','ur'),chip('Validado','ok'),'<button class="btn bs sm">Ver</button>'],
  ['<b>Hospital del Norte</b><small>Hospital público</small>','Quillacollo','4-4260109',chip('Sin solicitudes','ne'),chip('Pendiente','am'),'<button class="btn bv sm">Validar</button> <button class="btn bs sm">Rechazar</button>']]),'<div class="pills"><span class="on">Todos</span><span>Validados</span><span>Pendientes</span></div>','building-hospital')],
 usu:['Usuarios','Cuentas y roles',()=>`<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">${kpi('Donantes','248','','Cuentas de donante','heart','#E11D48')}${kpi('Hospitales','4','','Cuentas de hospital','building-hospital','#2563EB')}${kpi('Administradores','2','','Equipo SEDES','shield-check','#16A34A')}</div>`+card('Todos los usuarios','',tabla(['Usuario','Rol','Grupo','Registro','Estado','Acciones'],[
  ['<div style="display:flex;gap:10px;align-items:center"><div class="ini">AM</div><div><b>Alejandro Morales</b><small>alejandro@correo.com</small></div></div>',chip('Donante','ur'),'O−','12 ene 2024',chip('Activo','ok'),'<button class="btn bs sm">Editar</button>'],
  ['<div style="display:flex;gap:10px;align-items:center"><div class="ini">MT</div><div><b>Dr. Marcelo Torrico</b><small>Hosp. Clínico Viedma</small></div></div>',chip('Hospital','az'),'—','03 mar 2024',chip('Activo','ok'),'<button class="btn bs sm">Editar</button>'],
  ['<div style="display:flex;gap:10px;align-items:center"><div class="ini">MS</div><div><b>Mariana Soliz</b><small>mariana@correo.com</small></div></div>',chip('Donante','ur'),'B−','20 nov 2026',chip('Activo','ok'),'<button class="btn bs sm">Editar</button>'],
  ['<div style="display:flex;gap:10px;align-items:center"><div class="ini">RP</div><div><b>Rodrigo Paz</b><small>rodrigo@correo.com</small></div></div>',chip('Donante','ur'),'O−','02 feb 2025',chip('Suspendido','ne'),'<button class="btn bs sm">Editar</button>']]),'<div class="pills"><span class="on">Todos</span><span>Donantes</span><span>Hospitales</span><span>Admin</span></div>','users')],
 cam:['Campañas','Jornadas de toda la red',()=>campanas(true)],
 rep:['Reportes','Indicadores de la red',()=>reportes()]}},
hos:{nombre:'Dr. Marcelo Torrico',cargo:'Hospital Clínico Viedma',ini:'MT',rolIco:'building-hospital',rolCol:'#E11D48',accion:'+ Nueva solicitud',
 nav:[['res','Resumen','layout-grid'],['sol','Solicitudes','droplet',3],['don','Donantes','users'],['cit','Citas y donaciones','calendar-event'],['cam','Campañas','speakerphone'],['rep','Reportes','chart-bar']],
 foot:['heart-handshake','Juntos salvamos vidas','Publica una solicitud y avisamos a los donantes compatibles.'],
 p:{
 res:['Resumen','Hospital Clínico Viedma',()=>`
 <div class="grid" style="grid-template-columns:repeat(4,1fr)">
 ${kpi('Urgencias activas','3',chip('O−, B−','ur'),'Necesitan donantes ya','alert-triangle','#E11D48')}
 ${kpi('Donantes aptos','48',chip('Cerca','ok'),'Pasaron los 3 meses','user-check','#16A34A')}
 ${kpi('Citas para hoy','12','','Donantes que vendrán','calendar-event','#2563EB')}
 ${kpi('Donaciones hoy','8','','Bolsas recibidas','droplet','#E11D48')}
 </div>
 <div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:18px">

 <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:20px"><label style="display:flex;gap:6px;align-items:center;color:var(--tx2)"><input type="checkbox"> Recordarme</label><a style="color:var(--rojo2);font-weight:600">Olvidé mi contraseña</a></div>
 <button class="btn bp" id="entrar" style="width:100%;justify-content:center;padding:14px;font-size:15px">Ingresar como ${{don:'donante',hos:'hospital',admin:'administrador'}[loginRol]} ${ic('arrow-right')}</button>
 <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--tx2)">${loginRol=='don'?'¿Aún no eres donante? <a style="color:var(--rojo2);font-weight:600">Crea tu cuenta</a>':loginRol=='hos'?'¿Tu hospital no está en la red? <a style="color:var(--rojo2);font-weight:600">Solicita el registro</a>':'Acceso solo para personal de SEDES'}</p>
 </div></div></div>`}

let vista='login',loginRol='don',pag={admin:'res',hos:'res',don:'ini'};
function app(r){const R=ROLES[r],p=pag[r],P=R.p[p];
 return `<div class="app"><aside class="side">
 <div class="logo"><div class="ic">${ic('droplet')}</div><div><b>DonaVida</b><small>Cochabamba</small></div></div>
 <div class="rolbox"><div class="av" style="background:${R.rolCol}1A;color:${R.rolCol}">${ic(R.rolIco)}</div><div><small>Portal</small><b>${{admin:'Administrador',hos:'Hospital',don:'Donante'}[r]}</b></div></div>
 <div class="lbl">Menú</div>
 <nav class="nav">${R.nav.map(n=>`<a class="${n[0]==p?'on':''}" data-p="${n[0]}">${ic(n[2])}${n[1]}${n[3]?`<span class="n">${n[3]}</span>`:''}</a>`).join('')}</nav>
 <div class="sidefoot"><b>${ic(R.foot[0])}${R.foot[1]}</b><p>${R.foot[2]}</p></div>
 <div class="salir" data-v="login">${ic('logout')}Cerrar sesión</div>
 </aside><main class="main"><header class="top"><div><h1>${P[0]}</h1><div class="sub">${P[1]}</div></div><div class="sp"></div>
 <div class="bell">${ic('bell')}</div><div class="user"><div class="av">${R.ini}</div><div><b>${R.nombre}</b><small>${R.cargo}</small></div></div>
 ${R.accion?`<button class="btn bp" style="padding:11px 18px">${ic('circle-plus')}${R.accion}</button>`:''}</header>
 <div class="cont">${P[2]()}</div></main></div>`}
function draw(){
 document.getElementById('demo').innerHTML=[['login','Login'],['admin','Administrador'],['hos','Hospital'],['don','Donante']].map(v=>`<button class="${vista==v[0]?'on':''}" data-v="${v[0]}">${v[1]}</button>`).join(' ');
 document.getElementById('root').innerHTML=vista=='login'?login():app(vista);}
document.addEventListener('click',e=>{const v=e.target.closest('[data-v]'),p=e.target.closest('[data-p]'),lr=e.target.closest('[data-lr]');
 if(v){vista=v.dataset.v;draw();scrollTo(0,0)}else if(p){pag[vista]=p.dataset.p;draw();scrollTo(0,0)}else if(lr){loginRol=lr.dataset.lr;draw()}else if(e.target.closest('#entrar')){vista=loginRol;draw()}});
draw();
</script>
</body>
</html>
